<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Yvonne KMS">
  <title>Yvonne KMS</title>
  <desc>Y monogram — clean geometric mark on dark navy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <!-- dark squircle -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- thin border -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#1E293B" stroke-width="1"/>
  <!-- Y letterform: geometric, sharp, equal-weight strokes, fully contained -->
  <path d="M 18 16 L 23 16 L 32 30.5 L 41 16 L 46 16 L 34.5 33.5 L 34.5 48 L 29.5 48 L 29.5 33.5 Z" fill="#F8FAFC"/>
  <!-- subtle blue accent in the V-notch negative space (decorative bevel, not a dot) -->
  <path d="M 32 30.5 L 29.5 33.5 L 34.5 33.5 Z" fill="#0369A1"/>
</svg>
