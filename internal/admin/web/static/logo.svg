<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Yvonne KMS">
  <title>Yvonne KMS</title>
  <defs>
    <!-- 主渐变：cyan-700 → cyan-600 (国密气质 / 蓝色 = 可信) -->
    <linearGradient id="g1" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
    <!-- 高光：从左上发散，模拟玻璃质感 -->
    <radialGradient id="g2" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Y 中央圆点：CTA 绿色 = 行动 / 启用 -->
    <radialGradient id="g3" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#16A34A"/>
    </radialGradient>
    <!-- 投影（柔和，避免硬边） -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- 背景：圆角方形 (squircle) + 盾形暗示 (顶部微凸尖) -->
  <path d="M8 16 Q8 8 16 8 L48 8 Q56 8 56 16 L56 48 Q56 56 48 56 L16 56 Q8 56 8 48 Z"
        fill="url(#g1)"/>

  <!-- 顶部高光叠层 -->
  <path d="M8 16 Q8 8 16 8 L48 8 Q56 8 56 16 L56 48 Q56 56 48 56 L16 56 Q8 56 8 48 Z"
        fill="url(#g2)"/>

  <!-- 内边框：暗色描边强化 -->
  <path d="M8 16 Q8 8 16 8 L48 8 Q56 8 56 16 L56 48 Q56 56 48 56 L16 56 Q8 56 8 48 Z"
        fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.5"/>

  <!-- Y 字形：两条斜线 + 中央圆点（钥匙孔 / 椭圆） -->
  <!-- 左上斜线 -->
  <path d="M20 18 L30 32" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <!-- 右上斜线 -->
  <path d="M44 18 L34 32" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <!-- 下方竖线（短） -->
  <path d="M32 32 L32 42" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <!-- 中央圆点（钥匙孔意象） -->
  <circle cx="32" cy="46" r="3" fill="url(#g3)"/>
  <circle cx="32" cy="46" r="3" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="0.5"/>
</svg>
