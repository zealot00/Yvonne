<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>登录 · Yvonne KMS</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preload" href="/static/icons.svg" as="image" type="image/svg+xml">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <header class="login-brand">
        <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#shield"/></svg>
        <div>
          <div class="login-brand-name">Yvonne KMS</div>
          <div class="login-brand-tag">v1.4.2 · 国密合规</div>
        </div>
      </header>

      <h1 id="login-title" class="login-title">管理控制台登录</h1>
      <p class="login-sub">需要 admin token + 动态口令（TOTP）+ 图形验证码</p>

      <div id="alert" class="alert alert-error hidden" role="alert" aria-live="assertive">
        <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#alert-circle"/></svg>
        <span id="alert-text"></span>
      </div>

      <form id="login-form" novalidate>
        <input type="hidden" id="device_fp" name="device_fp" value="">
        <input type="hidden" id="device_fingerprint" name="device_fingerprint" value="">

        <div class="field">
          <label class="field-label" for="admin_token">
            <svg class="icon" aria-hidden="true" style="vertical-align:-3px;margin-right:4px"><use href="/static/icons.svg#key-round"/></svg>
            Admin Token
          </label>
          <div class="input-with-icon">
            <input
              id="admin_token"
              class="input"
              name="admin_token"
              type="password"
              autocomplete="current-password"
              required
              placeholder="输入管理员令牌"
              aria-required="true">
            <button type="button" id="toggle-pw" class="input-icon-btn" aria-label="显示/隐藏口令">
              <svg id="eye-icon" class="icon" aria-hidden="true"><use href="/static/icons.svg#eye"/></svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="totp_code">
            <svg class="icon" aria-hidden="true" style="vertical-align:-3px;margin-right:4px"><use href="/static/icons.svg#lock"/></svg>
            TOTP 动态口令
          </label>
          <input
            id="totp_code"
            class="input"
            name="totp_code"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{6}"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="000000"
            aria-required="true">
        </div>

        <div class="field">
          <label class="field-label" for="captcha_text">
            <svg class="icon" aria-hidden="true" style="vertical-align:-3px;margin-right:4px"><use href="/static/icons.svg#zap"/></svg>
            图形验证码
          </label>
          <div class="captcha">
            <div class="captcha-canvas" id="captcha-canvas" role="img" aria-label="图形验证码">
              <span class="text-mono text-muted text-xs" id="captcha-placeholder">加载中...</span>
            </div>
            <button type="button" id="refresh-captcha" class="captcha-refresh" aria-label="刷新验证码">
              <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#refresh-cw"/></svg>
            </button>
          </div>
          <input
            id="captcha_id"
            name="captcha_id"
            type="hidden"
            value="">
          <input
            id="captcha_text"
            class="input mt-4"
            name="captcha_text"
            type="text"
            autocomplete="off"
            required
            maxlength="5"
            placeholder="输入图中的 5 字符（区分大小写）"
            aria-required="true"
            style="margin-bottom:0">
        </div>

        <label class="checkbox">
          <input type="checkbox" id="remember" name="remember">
          <span>记住此设备 30 天（跳过验证码 + TOTP）</span>
        </label>

        <button type="submit" id="btn-submit" class="btn btn-primary">
          <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#key-round"/></svg>
          登&nbsp;&nbsp;录
        </button>
      </form>

      <footer class="login-foot">
        <span>会话策略：30 分钟无操作自动退出 · 最长 8 小时强制退出</span><br>
        <span>失败 3 次将锁定 30 分钟（等保三级 b 项）</span>
      </footer>
    </section>
  </main>

  <script src="/static/auth.js"></script>
</body>
</html>
